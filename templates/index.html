<!doctype html>
<html>

<head>
    <title>Upload Plant Image</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    <h1>Identify Your Plant</h1>
    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="plant_image" required>
        <input type="submit" value="Identify">
    </form>

    <a href="{{ url_for('plants') }}">
        <button id="v1">View Plants</button>
    </a>

    <a href="{{ url_for('show_tasks') }}">
        <button id="v2">View Tasks</button>
    </a>

</body>

</html>
