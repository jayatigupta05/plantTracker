<!doctype html>
<html>
<head>
    <title>Identified Plants</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <h1>Your Plants</h1>
  <ul>
    {% for plant in plants %}
      <ul>
            <li>
                <h2>{{ plant[1] }}</h2>
                <strong>Scientific name:</strong> {{ plant[2] }}<br>  <!-- plant[3] should be watering frequency -->
                <strong>Watering Frequency:</strong> {{ plant[3] }} days<br>  <!-- plant[3] should be watering frequency -->
                <strong>Sunlight:</strong> {{ plant[5] }}<br>  <!-- plant[4] should be sunlight information -->
                <strong>Soil Type:</strong> {{ plant[7] }}<br>
            </li>
    </ul>    
    {% endfor %}
  </ul>
</body>
</html>
